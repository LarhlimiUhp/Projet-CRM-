<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Genius - Université Hassan 1er</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .logo-shadow { filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1)); }
    </style>
</head>
<body class="bg-slate-50">

    <!-- 1. INTERFACE DE CONNEXION -->
    <div id="login-page" class="min-h-screen bg-slate-900 flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-white rounded-3xl p-10 shadow-2xl transition-all transform hover:scale-[1.01]">
            <div class="flex flex-col items-center mb-10 text-center">
                <!-- LOGO UH1 INTÉGRÉ ICI -->
                <div class="mb-6">
                    <img src="logo.png" alt="Université Hassan 1er" class="h-32 w-auto logo-shadow">
                </div>
                <h1 class="text-2xl font-black text-slate-800 uppercase tracking-tighter border-t-2 border-purple-600 pt-2">CRM Gestion Relation</h1>
                <p class="text-slate-400 font-medium mt-1">Plateforme Commerciale</p>
            </div>
            <div class="space-y-4">
                <input type="email" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-purple-500" placeholder="Email" value="admin@uh1.ac.ma">
                <input type="password" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-purple-500" placeholder="Mot de passe" value="password">
                <button onclick="login()" class="w-full py-4 bg-purple-700 text-white rounded-xl font-black shadow-xl shadow-purple-200 hover:bg-purple-800 transition-all active:scale-95">
                    Se connecter
                </button>
            </div>
            <p class="text-center text-[10px] text-slate-400 mt-8 uppercase tracking-widest font-bold italic">Université Hassan 1er - Settat</p>
        </div>
    </div>

    <!-- 2. INTERFACE PRINCIPALE -->
    <div id="main-app" class="hidden min-h-screen flex flex-col">
        <!-- Navbar -->
        <nav class="h-16 bg-white border-b border-slate-200 text-slate-800 flex items-center justify-between px-6 fixed w-full z-50">
            <div class="flex items-center gap-8">
                <!-- LOGO UH1 DANS LA NAVBAR -->
                <div class="flex items-center gap-3">
                    <img src="logo.png" alt="UH1" class="h-12 w-auto">
                    <div class="h-8 w-[1px] bg-slate-300"></div>
                    <span class="font-black text-lg tracking-tighter text-purple-700">CRM MANAGER</span>
                </div>
                <div class="flex gap-6">
                    <span class="text-sm font-bold text-purple-700 border-b-2 border-purple-700 pb-5 translate-y-2 cursor-pointer">Ventes</span>
                    <span class="text-sm font-bold text-slate-400 hover:text-purple-700 cursor-pointer transition">Analyses</span>
                    <span class="text-sm font-bold text-slate-400 hover:text-purple-700 cursor-pointer transition">Configuration</span>
                </div>
            </div>
            <div class="flex items-center gap-5 text-slate-400">
                <i data-lucide="search" class="w-5 h-5 cursor-pointer hover:text-purple-700"></i>
                <i data-lucide="bell" class="w-5 h-5 cursor-pointer hover:text-purple-700"></i>
                <div class="flex items-center gap-2 cursor-pointer group">
                    <span class="text-xs font-bold text-slate-600 group-hover:text-purple-700">Admin UH1</span>
                    <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center font-bold text-xs text-slate-600 border border-slate-300 group-hover:bg-purple-100 transition">AD</div>
                </div>
            </div>
        </nav>

        <!-- Filtres -->
        <div class="mt-16 px-6 py-3 border-b bg-white flex gap-2 items-center">
            <button class="px-4 py-1.5 bg-slate-800 text-white rounded-lg text-xs font-bold">Pipeline Principal</button>
            <button class="px-4 py-1.5 bg-slate-100 text-slate-500 rounded-lg text-xs font-bold hover:bg-slate-200 transition">Mes Opportunités</button>
            <button class="px-4 py-1.5 bg-slate-100 text-slate-500 rounded-lg text-xs font-bold hover:bg-slate-200 transition">À relancer</button>
            <div class="ml-auto flex items-center gap-2 text-white bg-purple-700 px-4 py-2 rounded-lg font-bold text-xs cursor-pointer hover:bg-purple-800 shadow-md transition">
                <i data-lucide="plus" class="w-4 h-4"></i> CRÉER UN LEAD
            </div>
        </div>

        <!-- Kanban Board -->
        <div class="flex-1 overflow-x-auto p-6 flex gap-6 items-start bg-slate-50">
            <!-- Colonne Nouveau -->
            <div class="w-80 flex-shrink-0">
                <div class="mb-4">
                    <div class="flex justify-between items-center text-[10px] font-black uppercase text-slate-400 mb-1 tracking-widest">
                        <span>Nouveau</span>
                        <span class="bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">2</span>
                    </div>
                    <div class="text-xl font-black text-slate-800">45 000,00 DH</div>
                    <div class="h-1 w-full bg-blue-500 mt-2 rounded-full"></div>
                </div>
                <div class="space-y-3">
                    <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm hover:border-purple-500 cursor-pointer transition-all">
                        <div class="text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-tighter">OCP Group</div>
                        <div class="font-bold text-slate-800 leading-tight mb-3">Fourniture de logiciels académiques</div>
                        <div class="flex justify-between items-center">
                            <span class="font-black text-slate-700">30 000 DH</span>
                            <div class="flex -space-x-2">
                                <div class="w-6 h-6 rounded-full bg-blue-100 border-2 border-white text-[8px] flex items-center justify-center font-bold">UH</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Colonne Qualifié -->
            <div class="w-80 flex-shrink-0">
                <div class="mb-4">
                    <div class="flex justify-between items-center text-[10px] font-black uppercase text-slate-400 mb-1 tracking-widest">
                        <span>Qualifié</span>
                        <span class="bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">1</span>
                    </div>
                    <div class="text-xl font-black text-slate-800">12 500,00 DH</div>
                    <div class="h-1 w-full bg-orange-500 mt-2 rounded-full"></div>
                </div>
                <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm hover:border-purple-500 cursor-pointer transition-all">
                    <div class="text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-tighter">Maroc Telecom</div>
                    <div class="font-bold text-slate-800 leading-tight mb-3">Audit de réseau campus</div>
                    <div class="flex justify-between items-center">
                        <span class="font-black text-slate-700">12 500 DH</span>
                        <i data-lucide="clock" class="text-orange-500 w-4 h-4"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        function login() {
            const loginPage = document.getElementById('login-page');
            const mainApp = document.getElementById('main-app');
            loginPage.style.opacity = '0';
            setTimeout(() => {
                loginPage.classList.add('hidden');
                mainApp.classList.remove('hidden');
                lucide.createIcons();
            }, 300);
        }
    </script>
</body>
</html>
